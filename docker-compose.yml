services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "50143:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    ports:
      - "50142:3000"
    volumes:
      - ./images:/app/images:Z
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - app-network
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hnagg.rule=Host(`hnagg.com`)"
      - "traefik.http.routers.hnagg.entrypoints=websecure"
      - "traefik.http.routers.hnagg.tls=true"
      - "traefik.http.routers.hnagg.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hnagg.middlewares=hnagg-compress,hnagg-security"
      - "traefik.http.middlewares.hnagg-compress.compress.defaultencoding=gzip"
      - "traefik.http.middlewares.hnagg-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.hnagg-security.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.hnagg-security.headers.frameDeny=true"
      - "traefik.http.middlewares.hnagg-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.hnagg-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.hnagg-security.headers.customResponseHeaders.Permissions-Policy=geolocation=(), microphone=(), camera=()"
      - "traefik.http.services.hnagg.loadbalancer.server.port=3000"
      # www → non-www redirect
      - "traefik.http.routers.hnagg-www.rule=Host(`www.hnagg.com`)"
      - "traefik.http.routers.hnagg-www.entrypoints=websecure"
      - "traefik.http.routers.hnagg-www.tls=true"
      - "traefik.http.routers.hnagg-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hnagg-www.middlewares=hnagg-security,hnagg-www-redirect"
      - "traefik.http.middlewares.hnagg-www-redirect.redirectregex.regex=^https://www\\.hnagg\\.com(.*)"
      - "traefik.http.middlewares.hnagg-www-redirect.redirectregex.replacement=https://hnagg.com$${1}"
      - "traefik.http.middlewares.hnagg-www-redirect.redirectregex.permanent=true"

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
  traefik-network:
    external: true
